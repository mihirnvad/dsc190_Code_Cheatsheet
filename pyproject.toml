[project]
name = "code-boilerplate-vault"
version = "0.1.0"
description = "A local command-line snippet vault for students and data scientists."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyperclip>=1.9.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
cb = "cb.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
